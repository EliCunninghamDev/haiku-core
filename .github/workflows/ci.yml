name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: bun / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run ${{ matrix.task }}
        run: |
          if [ "${{ matrix.task }}" = "typecheck" ]; then
            bunx tsc --noEmit
          else
            bun test
          fi

  rust:
    name: rust / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, clippy, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run ${{ matrix.task }}
        run: |
          case "${{ matrix.task }}" in
            fmt)    cargo fmt --manifest-path rust/Cargo.toml --check ;;
            clippy) cargo clippy --manifest-path rust/Cargo.toml -- -D warnings ;;
            test)   cargo test --manifest-path rust/Cargo.toml ;;
            build)  cargo build --release --manifest-path rust/Cargo.toml ;;
          esac
