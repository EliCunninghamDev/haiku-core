version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # bun types track the runtime; do not chase them weekly.
      - dependency-name: "@types/bun"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
