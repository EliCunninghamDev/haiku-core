name: Bug report
description: Something counted wrong, crashed, or exited with the wrong code.
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, stop here and read [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: poem
    attributes:
      label: The poem or input
      description: Paste the exact input. Three lines, please.
      render: text
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: Expected counts
      placeholder: "5, 7, 5"
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: Actual counts
      placeholder: "5, 6, 5"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - rust
        - typescript
        - unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.4.2 or a commit sha"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Bun 1.4.5 / rustc 1.100.0 / Arch"
    validations:
      required: false
